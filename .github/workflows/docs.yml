name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install '.[docs]'
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        name: Upload site for deployment
        with:
          name: github-pages
          path: site
          retention-days: 7

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        name: Deploy site
        id: deployment
        with:
          artifact_name: github-pages
