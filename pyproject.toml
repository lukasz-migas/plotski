[build-system]
requires = [
    "setuptools>=77",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "plotski"
description = "Convenient interactive plotting in Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "lukas.migas@yahoo.com", name = "Lukasz G. Migas" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dynamic = ["version"]
dependencies = [
    "bokeh>=3.1.0",
    "numpy>=2",
    "scikit-image>=0.19.0",
    "matplotlib>=3.3.0",
    "koyo",
]

[project.optional-dependencies]
plotly = [
    "plotly>=6",
]
bokeh-export = [
    "bokeh>=3.8",
    "selenium>=4",
]
plotly-export = [
    "plotly>=6.1.1",
    "kaleido>=1",
]
docs = [
    "zensical; python_version >= '3.11'",
]
test = [
    "pytest>=6.0",
    "pytest-cov",
]
dev = [
    "ipython",
    "mypy",
    "pdbpp",
    "pre-commit",
    "rich",
    "ruff",
    "plotski[test]"
]

[project.urls]
homepage = "https://github.com/lukasz-migas/plotski"
repository = "https://github.com/lukasz-migas/plotski"

[tool.setuptools_scm]
version_file = "src/plotski/_version.py"

[tool.setuptools.package-data]
plotski = ["_report.js"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

[tool.ruff.lint]
ignore = ["E501", "UP006", "UP007", "TC001", "TC002", "TC003"]
# https://beta.ruff.rs/docs/rules/
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "I",    # isort
    "UP",   # pyupgrade
    # "S",    # bandit
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
]
# I do this to get numpy-style docstrings AND retain
# D417 (Missing argument descriptions in the docstring)
# otherwise, see:
# https://beta.ruff.rs/docs/faq/#does-ruff-support-numpy-or-google-style-docstrings
# https://github.com/charliermarsh/ruff/issues/2606
extend-ignore = [
    "C901", # Function is too complex
    "D100", # Missing docstring in public module
    "D102", # Mising docstring in magic method
    "D105", # Mising docstring in magic method
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D401", # First line should be in imperative mood
    "D413", # Missing blank line after last section
    "D416", # Section name should end with a colon
]
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

[tool.ruff.lint.isort]
known-first-party = ["plotski"]

[tool.ruff.format]
docstring-code-format = true

# https://docs.pytest.org/en/6.2.x/customize.html
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
# NOTE: only put things that will never change in here.
# plotski deprecation and future warnings should NOT go in here.
# instead... assert the warning with `pytest.warns()` in the relevant test,
# That way we can clean them up when no longer necessary
filterwarnings = [
    "error:::plotski", # turn warnings from plotski into errors
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore:numpy.ufunc size changed:RuntimeWarning",]
# These follow standard library warnings filters syntax.  See more here:
# https://docs.python.org/3/library/warnings.html#describing-warning-filters
addopts = "--maxfail=5 --durations=5"


[tool.mypy]
files = ["src"]
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true
no_implicit_optional = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# https://coverage.readthedocs.io/en/6.4/config.html
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "def test",
    "if settings.DEBUG",
    "def __repr__"
]
[tool.coverage.run]
source = ["plotski"]
omit = ["*/__init__.py", "*/_version.py"]

# https://github.com/mgedmin/check-manifest#configuration
[tool.check-manifest]
ignore = [
    "**/*_version.py",
    "Makefile",
    "renovate.json",
    "mkdocs.yml",
    "docs/*",
]
